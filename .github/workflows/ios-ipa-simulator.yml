name: iOS IPA + Simulator Validation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-ipa-simulator.yml'

permissions:
  contents: read

concurrency:
  group: ayna-ios-ipa-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator_test:
    name: Validate Ayna on iOS Simulator
    runs-on: macos-26
    timeout-minutes: 35

    env:
      PROJECT: AynaMobile.xcodeproj
      APP_SCHEME: Ayna-iOS
      UI_TEST_PROJECT: AynaUITests.xcodeproj
      UI_TEST_SCHEME: AynaIOSUITests
      DERIVED_DATA: ${{ github.workspace }}/build/simulator
      RESULT_BUNDLE: ${{ github.workspace }}/build/TestResults-iOS-UI.xcresult
      ARTIFACT_DIR: ${{ github.workspace }}/build/simulator-artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /Applications/Xcode_26.2.app ]]; then
            XCODE_PATH=/Applications/Xcode_26.2.app
          else
            XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          fi
          if [[ -z "${XCODE_PATH:-}" ]]; then
            echo "ERROR: Xcode 26 was not found."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Prepare output directories
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$DERIVED_DATA" "$RESULT_BUNDLE" "$ARTIFACT_DIR"
          mkdir -p "$DERIVED_DATA" "$ARTIFACT_DIR"

      - name: Select and boot iPhone simulator
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Available iOS runtimes ==="
          xcrun simctl list runtimes | grep -i ios || true
          echo "=== Available iPhones ==="
          xcrun simctl list devices available | grep -i iphone || true

          DEVICE_UDID="$(xcrun simctl list devices available | grep 'iPhone 17' | tail -n 1 | grep -oE '[A-F0-9-]{36}' || true)"
          if [[ -z "$DEVICE_UDID" ]]; then
            DEVICE_UDID="$(xcrun simctl list devices available | grep -i 'iPhone' | tail -n 1 | grep -oE '[A-F0-9-]{36}' || true)"
          fi
          if [[ -z "$DEVICE_UDID" ]]; then
            echo "ERROR: No available iPhone simulator was found."
            exit 1
          fi

          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          echo "Using simulator: $DEVICE_UDID"
          xcrun simctl shutdown "$DEVICE_UDID" 2>/dev/null || true
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$APP_SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build app for simulator
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Debug \
            -destination "id=$DEVICE_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee "$ARTIFACT_DIR/simulator-build.log"

      - name: Install and launch app
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -type d -name 'Ayna.app' -path '*/Debug-iphonesimulator/*' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "ERROR: Simulator Ayna.app was not found."
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          echo "IOS_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "IOS_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" 2>&1 | tee "$ARTIFACT_DIR/simulator-launch.log"
          sleep 5
          xcrun simctl io "$DEVICE_UDID" screenshot "$ARTIFACT_DIR/Ayna-iOS-simulator.png"

      - name: Run iOS UI tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          for attempt in 1 2; do
            echo "UI test attempt $attempt of 2"
            rm -rf "$RESULT_BUNDLE"
            if xcodebuild \
              -project "$UI_TEST_PROJECT" \
              -scheme "$UI_TEST_SCHEME" \
              -destination "id=$DEVICE_UDID" \
              -resultBundlePath "$RESULT_BUNDLE" \
              -parallel-testing-enabled NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              -retry-tests-on-failure \
              test \
              2>&1 | tee "$ARTIFACT_DIR/ui-tests-attempt-${attempt}.log"; then
              exit 0
            fi
            if [[ "$attempt" == "1" ]]; then
              sleep 5
            fi
          done
          exit 1

      - name: Collect simulator diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ARTIFACT_DIR"
          if [[ -n "${DEVICE_UDID:-}" ]]; then
            xcrun simctl io "$DEVICE_UDID" screenshot "$ARTIFACT_DIR/Ayna-iOS-final.png" || true
            xcrun simctl spawn "$DEVICE_UDID" log show \
              --style compact \
              --last 10m \
              --predicate 'process == "Ayna"' \
              > "$ARTIFACT_DIR/Ayna-simulator.log" 2>&1 || true
          fi

      - name: Upload simulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ayna-iOS-simulator-${{ github.run_number }}
          path: |
            build/simulator-artifacts
            build/TestResults-iOS-UI.xcresult
          if-no-files-found: warn
          retention-days: 14

  build_ipa:
    name: Build unsigned iOS IPA
    needs: simulator_test
    runs-on: macos-26
    timeout-minutes: 35

    env:
      PROJECT: AynaMobile.xcodeproj
      SCHEME: Ayna-iOS
      DERIVED_DATA: ${{ github.workspace }}/build/device
      OUTPUT_DIR: ${{ github.workspace }}/build/output
      LOG_DIR: ${{ github.workspace }}/build/device-logs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d /Applications/Xcode_26.2.app ]]; then
            XCODE_PATH=/Applications/Xcode_26.2.app
          else
            XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort -V | tail -n 1)"
          fi
          if [[ -z "${XCODE_PATH:-}" ]]; then
            echo "ERROR: Xcode 26 was not found."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Prepare build directories
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$DERIVED_DATA" "$OUTPUT_DIR" "$LOG_DIR"
          mkdir -p "$DERIVED_DATA" "$OUTPUT_DIR" "$LOG_DIR"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -Eeuo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build unsigned device app
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee "$LOG_DIR/xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -type d -name 'Ayna.app' -path '*/Release-iphoneos/*' -print -quit)"
          if [[ -z "$APP_PATH" || ! -d "$APP_PATH" ]]; then
            echo "ERROR: Device Ayna.app was not found."
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          if [[ -z "$EXECUTABLE_NAME" || ! -f "$APP_PATH/$EXECUTABLE_NAME" ]]; then
            echo "ERROR: Built app executable is missing."
            exit 1
          fi

          PACKAGE_DIR="$OUTPUT_DIR/package"
          IPA_PATH="$OUTPUT_DIR/Ayna-unsigned.ipa"
          mkdir -p "$PACKAGE_DIR/Payload"

          rm -rf "$APP_PATH/_CodeSignature"
          find "$APP_PATH" -name 'embedded.mobileprovision' -delete
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/Ayna.app"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH"
          )

          unzip -t "$IPA_PATH" | tee "$LOG_DIR/ipa-integrity.log"
          unzip -l "$IPA_PATH" > "$LOG_DIR/ipa-contents.log"

          IPA_ENTRIES="$(unzip -Z1 "$IPA_PATH")"
          grep -qx 'Payload/Ayna.app/Info.plist' <<< "$IPA_ENTRIES"
          if grep -Eq '(^|/)embedded[.]mobileprovision$' <<< "$IPA_ENTRIES"; then
            echo "ERROR: IPA unexpectedly contains a provisioning profile."
            exit 1
          fi
          if grep -Eq '(^|/)_CodeSignature/' <<< "$IPA_ENTRIES"; then
            echo "ERROR: IPA unexpectedly contains a code signature."
            exit 1
          fi

          shasum -a 256 "$IPA_PATH" | tee "$OUTPUT_DIR/SHA256SUMS.txt"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ayna-unsigned-IPA-${{ github.run_number }}
          path: |
            build/output/Ayna-unsigned.ipa
            build/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload device build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ayna-device-build-diagnostics-${{ github.run_number }}
          path: build/device-logs
          if-no-files-found: warn
          retention-days: 14
